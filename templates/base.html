{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FAQ Service{% endblock %}</title>
    <link
        rel="icon"
        type="image/svg+xml"
        href="{% static 'img/faq-logo.svg' %}"
    >
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="navbar navbar-expand navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2"
               href="{% url 'homepage:index' %}">
                <img
                    class="brand-logo"
                    src="{% static 'img/faq-logo.svg' %}"
                    alt=""
                    width="36"
                    height="36"
                >
                <span>FAQ Service</span>
            </a>
            {% include "includes/navigation.html" %}
        </div>
    </header>
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>
    <footer class="container py-3 text-body-secondary">
        <small>© <span id="current-year"></span> FAQ Service</small>
    </footer>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
